<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .game {
            border: 1px solid #ccc;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        .game p {
            margin: 5px 0;
        }

        .game div p {
            text-align: justify;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .error {
            color: red;
        }

        .loading {
            color: blue;
        }
    </style>
</head>

<body>
    <h1>Sierra Games API Test</h1>
    <div id="status"></div>
    <div id="games"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8085/api';

        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const gamesDiv = document.getElementById('games');

            try {
                statusDiv.innerHTML = '<div class="loading">Loading games from API...</div>';

                const response = await fetch(`${API_BASE_URL}/games`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const games = await response.json();

                statusDiv.innerHTML = `<div>✅ Successfully loaded ${games.length} games</div>`;

                gamesDiv.innerHTML = games.slice(0, 5).map(game => {
                    // Convert escaped newlines to actual HTML line breaks
                    // In JSON, \n becomes actual newline when parsed, so split directly
                    const paragraphs = game.longDescription.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('');

                    return `
                        <div class="game">
                            <h3>${game.title}</h3>
                            <p><strong>Series:</strong> ${game.series} (${game.seriesName})</p>
                            <p><strong>Year:</strong> ${game.year}</p>
                            <p><strong>Developer:</strong> ${game.developer}</p>
                            <p><strong>Short Description:</strong> ${game.shortDescription}</p>
                            <div><strong>Long Description:</strong></div>
                            <div style="margin-left: 20px;">${paragraphs}</div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                statusDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                gamesDiv.innerHTML = '';
            }
        }

        // Test the API when page loads
        testAPI();
    </script>
</body>

</html>
